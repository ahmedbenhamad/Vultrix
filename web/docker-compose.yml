services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: strix
      POSTGRES_PASSWORD: strix
      POSTGRES_DB: strix_console
    ports:
      - "5432:5432"
    volumes:
      - strix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strix"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # async engine derives asyncpg; sync engine (worker/alembic) derives psycopg
      DATABASE_URL: postgresql+psycopg://strix:strix@db:5432/strix_console
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      BACKEND_CORS_ORIGINS: http://localhost:3000
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@strix.local}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-ChangeMe123!}
    ports:
      - "8080:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_ORIGIN: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    ports:
      - "3000:3000"

volumes:
  strix_pgdata:
