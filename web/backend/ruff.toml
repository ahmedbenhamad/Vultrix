target-version = "py311"
line-length = 110

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PERF"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "PERF203",
    "PERF401", # explicit append loops are clearer for reportlab story building
]

[lint.per-file-ignores]
"alembic/*" = ["F401", "E402", "UP"]  # generated migrations use Union/Optional syntax
"tests/*" = ["E402"]           # conftest sets env before imports on purpose
"app/db/seed.py" = ["E402"]
